  <style>
    /* ==========================================================================
       APPLE HIG & DESIGN.md HARMONIZED MASTER SPECIFICATION
       ========================================================================== */
    :root {
      /* Surface & Canvas (DESIGN.md Section 1.1) */
      --bg-canvas: var(--color-bg-app, #0B0B10);
      --card-bg: var(--color-bg-card, rgba(22, 22, 30, 0.85));
      --card-border: var(--color-border-card, rgba(255, 255, 255, 0.08));
      --card-border-top: var(--color-border-card-top, rgba(255, 255, 255, 0.22));
      
      /* Typography Colors (DESIGN.md Section 1.1) */
      --text-white: var(--color-text-white, #FFFFFF);
      --text-secondary: var(--color-text-secondary, #A1A1A6);
      --text-muted: var(--color-text-muted, #6E6E73);
      --text-subtle: var(--color-text-subtle-light, #D1D1D6);
      
      /* Accent Colors (DESIGN.md Section 1.1) */
      --apple-green: var(--color-brand-green, #30D158);
      --apple-cyan: var(--color-brand-cyan, #64D2FF);
      --apple-orange: var(--color-brand-orange, #FF9F0A);
      --apple-red: var(--color-brand-red, #FF453A);
      
      /* Periodisierungs-Balken & Tiered Phases */
      --phase-build-light-bg: rgba(100, 210, 255, 0.08);
      --phase-build-light-border: rgba(100, 210, 255, 0.22);
      --phase-build-light-text: #BEEBFF;

      --phase-build-bg: rgba(100, 210, 255, 0.18);
      --phase-build-border: rgba(100, 210, 255, 0.42);
      --phase-build-text: #D6F2FF;

      --phase-build-peak-bg: rgba(100, 210, 255, 0.32);
      --phase-build-peak-border: rgba(100, 210, 255, 0.65);
      --phase-build-peak-text: #FFFFFF;

      --phase-taper-bg: rgba(100, 210, 255, 0.12);
      --phase-taper-border: rgba(100, 210, 255, 0.28);
      --phase-taper-text: #C7EEFF;

      --phase-rekom-acute-bg: rgba(48, 209, 88, 0.28);
      --phase-rekom-acute-border: rgba(48, 209, 88, 0.55);
      --phase-rekom-acute-text: #E4FDE8;

      --phase-rekom-bg: rgba(48, 209, 88, 0.16);
      --phase-rekom-border: rgba(48, 209, 88, 0.40);
      --phase-rekom-text: #C6F7D0;

      --phase-rekom-light-bg: rgba(48, 209, 88, 0.08);
      --phase-rekom-light-border: rgba(48, 209, 88, 0.22);
      --phase-rekom-light-text: #B0F4BD;

      --phase-vacation-bg: rgba(255, 214, 10, 0.16);
      --phase-vacation-border: rgba(255, 214, 10, 0.40);
      --phase-vacation-text: #FFF3C4;

      --phase-race-bg: var(--apple-orange, #FF9F0A);
      --phase-race-glow: rgba(255, 159, 10, 0.40);
      
      /* Apple San Francisco Typography Stack */
      --font-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", sans-serif;
      --font-text: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      background-color: var(--bg-canvas);
      color: var(--text-white);
      font-family: var(--font-text);
      padding: 3rem 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .planner-container {
      width: 100%;
      max-width: 1440px;
      display: flex;
      flex-direction: column;
      gap: 2.25rem;
    }

    /* HEADER: APPLE CALENDAR PAGER */
    header {
      display: flex;
      justify-content: center;
      align-items: center;
      padding-bottom: 0.5rem;
    }

    .season-pager-bar {
      height: 44px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      user-select: none;
    }

    .season-pager-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: var(--text-white);
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.35rem;
      line-height: 1;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .season-pager-btn:hover {
      background: rgba(255, 255, 255, 0.18);
      border-color: rgba(255, 255, 255, 0.25);
      transform: scale(1.06);
    }

    .season-pager-btn:active {
      transform: scale(0.94);
    }

    .season-pager-label {
      height: 44px;
      display: inline-flex;
      align-items: center;
      gap: 12px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 0 22px;
      border-radius: 9999px;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }

    .season-pager-title {
      font-family: var(--font-display);
      font-size: 1.05rem;
      font-weight: 800;
      letter-spacing: -0.015em;
      color: var(--text-white);
    }

    .season-pager-range {
      font-family: var(--font-text);
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--apple-cyan);
      letter-spacing: 0.02em;
    }

    /* DIE 3 MONATSBLÖCKE NEBENEINANDER */
    .three-months-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 2rem;
    }

    .month-block {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-top: 1px solid var(--card-border-top);
      border-radius: 26px;
      padding: 2rem 1.6rem;
      display: flex;
      flex-direction: column;
      gap: 1.35rem;
      box-shadow: 0 20px 48px rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(24px);
    }

    .month-header {
      display: flex;
      justify-content: center;
      align-items: center;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }

    .month-title {
      font-family: var(--font-display);
      font-size: 1.65rem;
      font-weight: 800;
      letter-spacing: -0.015em;
      text-align: center;
    }

    /* KALENDER-MATRIX */
    .calendar-matrix {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .week-row {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 0;
      height: 56px;
      position: relative;
    }

    .cal-cell {
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-text);
      font-size: 1.20rem;
      font-weight: 500;
      font-feature-settings: "tnum" on;
      user-select: none;
      position: relative;
      height: 100%;
      border: 1px solid transparent;
      color: var(--text-secondary);
      transition: background 0.12s ease;
    }

    .cal-cell.empty {
      cursor: default;
    }

    .cal-cell.neutral-day {
      background: rgba(255, 255, 255, 0.025);
      border-radius: 8px;
      margin: 1.5px;
      cursor: default;
    }

    .cal-cell.is-interactive {
      cursor: pointer;
    }

    .cal-cell.is-interactive:hover {
      filter: brightness(1.2);
    }

    /* SONNTAGS-ZIFFER (SANFTE AUSZEICHNUNGSFARBE OHNE ROTEN ALARM-CHARAKTER) */
    .cal-cell.is-sunday:not(.phase-race) {
      color: rgba(255, 140, 130, 0.70) !important;
      font-weight: var(--typography-font-weight-bold, 700);
    }

    /* PERIODISIERUNGS-BALKEN & GESTUFTE AUFBAU-/REKOM-PHASEN */
    .cal-cell.phase-build-light {
      background: var(--phase-build-light-bg) !important;
      border-top: 1px solid var(--phase-build-light-border);
      border-bottom: 1px solid var(--phase-build-light-border);
      color: var(--phase-build-light-text) !important;
      font-weight: var(--typography-font-weight-semibold, 600);
      margin: 1.5px 0;
    }
    .cal-cell.phase-build-light.bar-start {
      border-top-left-radius: 8px;
      border-bottom-left-radius: 8px;
      border-left: 1px solid var(--phase-build-light-border);
    }
    .cal-cell.phase-build-light.bar-end {
      border-top-right-radius: 8px;
      border-bottom-right-radius: 8px;
      border-right: 1px solid var(--phase-build-light-border);
    }

    .cal-cell.phase-build {
      background: var(--phase-build-bg) !important;
      border-top: 1px solid var(--phase-build-border);
      border-bottom: 1px solid var(--phase-build-border);
      color: var(--phase-build-text) !important;
      font-weight: var(--typography-font-weight-semibold, 600);
      margin: 1.5px 0;
    }
    .cal-cell.phase-build.bar-start {
      border-top-left-radius: 8px;
      border-bottom-left-radius: 8px;
      border-left: 1px solid var(--phase-build-border);
    }
    .cal-cell.phase-build.bar-end {
      border-top-right-radius: 8px;
      border-bottom-right-radius: 8px;
      border-right: 1px solid var(--phase-build-border);
    }

    .cal-cell.phase-build-peak {
      background: var(--phase-build-peak-bg) !important;
      border-top: 1px solid var(--phase-build-peak-border);
      border-bottom: 1px solid var(--phase-build-peak-border);
      color: var(--phase-build-peak-text) !important;
      font-weight: var(--typography-font-weight-bold, 700);
      margin: 1.5px 0;
    }
    .cal-cell.phase-build-peak.bar-start {
      border-top-left-radius: 8px;
      border-bottom-left-radius: 8px;
      border-left: 1px solid var(--phase-build-peak-border);
    }
    .cal-cell.phase-build-peak.bar-end {
      border-top-right-radius: 8px;
      border-bottom-right-radius: 8px;
      border-right: 1px solid var(--phase-build-peak-border);
    }

    .cal-cell.phase-taper {
      background: var(--phase-taper-bg) !important;
      border-top: 1px solid var(--phase-taper-border);
      border-bottom: 1px solid var(--phase-taper-border);
      color: var(--phase-taper-text) !important;
      font-weight: var(--typography-font-weight-semibold, 600);
      margin: 1.5px 0;
    }
    .cal-cell.phase-taper.bar-start {
      border-top-left-radius: 8px;
      border-bottom-left-radius: 8px;
      border-left: 1px solid var(--phase-taper-border);
    }
    .cal-cell.phase-taper.bar-end {
      border-top-right-radius: 8px;
      border-bottom-right-radius: 8px;
      border-right: 1px solid var(--phase-taper-border);
    }

    .cal-cell.phase-rekom-acute {
      background: var(--phase-rekom-acute-bg) !important;
      border-top: 1px solid var(--phase-rekom-acute-border);
      border-bottom: 1px solid var(--phase-rekom-acute-border);
      color: var(--phase-rekom-acute-text) !important;
      font-weight: var(--typography-font-weight-bold, 700);
      margin: 1.5px 0;
    }
    .cal-cell.phase-rekom-acute.bar-start {
      border-top-left-radius: 8px;
      border-bottom-left-radius: 8px;
      border-left: 1px solid var(--phase-rekom-acute-border);
    }
    .cal-cell.phase-rekom-acute.bar-end {
      border-top-right-radius: 8px;
      border-bottom-right-radius: 8px;
      border-right: 1px solid var(--phase-rekom-acute-border);
    }

    .cal-cell.phase-rekom {
      background: var(--phase-rekom-bg) !important;
      border-top: 1px solid var(--phase-rekom-border);
      border-bottom: 1px solid var(--phase-rekom-border);
      color: var(--phase-rekom-text) !important;
      font-weight: var(--typography-font-weight-semibold, 600);
      margin: 1.5px 0;
    }
    .cal-cell.phase-rekom.bar-start {
      border-top-left-radius: 8px;
      border-bottom-left-radius: 8px;
      border-left: 1px solid var(--phase-rekom-border);
    }
    .cal-cell.phase-rekom.bar-end {
      border-top-right-radius: 8px;
      border-bottom-right-radius: 8px;
      border-right: 1px solid var(--phase-rekom-border);
    }

    .cal-cell.phase-rekom-light {
      background: var(--phase-rekom-light-bg) !important;
      border-top: 1px solid var(--phase-rekom-light-border);
      border-bottom: 1px solid var(--phase-rekom-light-border);
      color: var(--phase-rekom-light-text) !important;
      font-weight: var(--typography-font-weight-semibold, 600);
      margin: 1.5px 0;
    }
    .cal-cell.phase-rekom-light.bar-start {
      border-top-left-radius: 8px;
      border-bottom-left-radius: 8px;
      border-left: 1px solid var(--phase-rekom-light-border);
    }
    .cal-cell.phase-rekom-light.bar-end {
      border-top-right-radius: 8px;
      border-bottom-right-radius: 8px;
      border-right: 1px solid var(--phase-rekom-light-border);
    }

    .cal-cell.phase-vacation {
      background: var(--phase-vacation-bg) !important;
      border-top: 1px solid var(--phase-vacation-border);
      border-bottom: 1px solid var(--phase-vacation-border);
      color: var(--phase-vacation-text) !important;
      font-weight: var(--typography-font-weight-semibold, 600);
      margin: 1.5px 0;
    }

    .cal-cell.phase-vacation.bar-start {
      border-top-left-radius: 8px;
      border-bottom-left-radius: 8px;
      border-left: 1px solid var(--phase-vacation-border);
    }

    .cal-cell.phase-vacation.bar-end {
      border-top-right-radius: 8px;
      border-bottom-right-radius: 8px;
      border-right: 1px solid var(--phase-vacation-border);
    }

    /* RENNTAG (HERVORSTEHENDER BLACK-NODE) */
    .cal-cell.phase-race {
      background: var(--phase-race-bg) !important;
      border: 1px solid rgba(255, 255, 255, 0.9) !important;
      color: #FFFFFF !important;
      font-weight: var(--typography-font-weight-black, 900) !important;
      font-size: var(--typography-font-size-xl, 1.25rem);
      border-radius: 8px !important;
      box-shadow: 0 0 16px var(--phase-race-glow);
      z-index: 3;
      margin: 1.5px;
    }

    .cal-cell.phase-option {
      border: 1px dashed rgba(191, 90, 242, 0.75) !important;
      border-radius: 8px;
      color: #E8B4F8 !important;
      font-weight: var(--typography-font-weight-bold, 700);
      margin: 1.5px;
      cursor: pointer;
    }

    .cal-cell.phase-option:hover {
      background: rgba(191, 90, 242, 0.15) !important;
      border-color: #E8B4F8 !important;
    }

    /* META-BANNER (APPLE HIG CARD MIT GOLDENER TYPOGRAFIE) */
    .quarter-meta-strip {
      display: flex;
      justify-content: center;
      align-items: center;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-top: 1px solid var(--card-border-top);
      border-radius: 20px;
      padding: 1.35rem 2.5rem;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.45);
      transition: all 0.25s ease;
    }

    .option-reg-link {
      color: var(--apple-cyan);
      font-weight: 800;
      text-decoration: underline;
      text-underline-offset: 3px;
      margin-left: 0.5rem;
      transition: color 0.15s ease;
    }
    .option-reg-link:hover {
      color: #FFFFFF;
    }

    .quarter-key-event {
      font-family: var(--font-text);
      font-size: 1.20rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      line-height: var(--typography-line-height-snug, 1.25);
      color: var(--apple-orange);
      text-align: center;
    }

    .cal-cell.is-selected {
      outline: 2px solid var(--apple-cyan) !important;
      outline-offset: 1px;
      z-index: 10 !important;
    }
    /* ==========================================================================
       VIEWPORT-ADAPTIVE ANSICHT
       Zeilenhöhe skaliert mit der Fensterhöhe, damit auch Monate mit 6 Wochenzeilen
       inklusive Ereigniszeile ohne Scrollen sichtbar bleiben.
       ========================================================================== */
    .planner-container {
      --cal-row-gap: 4px;
      --cal-row-h: clamp(32px, calc((100vh - 445px) / 6), 56px);
      gap: 1.25rem;
    }

    body {
      padding-top: 1.75rem;
      padding-bottom: 1.75rem;
    }

    .month-block {
      padding: 1.25rem 1.5rem 1.5rem;
      gap: 1rem;
    }

    .month-header {
      padding-bottom: 0.6rem;
    }

    .month-title {
      font-size: 1.6rem;
    }

    .calendar-matrix {
      gap: var(--cal-row-gap);
      min-height: calc(6 * var(--cal-row-h) + 5 * var(--cal-row-gap));
    }

    .week-row {
      height: var(--cal-row-h);
    }

    .cal-cell {
      font-size: clamp(0.95rem, calc(var(--cal-row-h) * 0.4), 1.25rem);
    }

    .cal-cell.phase-race {
      font-size: clamp(1rem, calc(var(--cal-row-h) * 0.42), 1.3rem);
    }

    .quarter-meta-strip {
      padding: 0.9rem 2rem;
    }

    /* ==========================================================================
       OPTION A: APPLE HIG SLIDE-OVER DRAWER (RACE BRIEFING)
       ========================================================================== */
    .race-drawer-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.60);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 998;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    .race-drawer-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }

    .race-drawer {
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      width: clamp(380px, 32vw, 480px);
      background: rgba(20, 20, 28, 0.95);
      border-left: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(32px);
      -webkit-backdrop-filter: blur(32px);
      box-shadow: -16px 0 48px rgba(0, 0, 0, 0.70);
      z-index: 999;
      transform: translateX(100%);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      padding: 2rem 2.25rem;
      gap: 1.4rem;
      box-sizing: border-box;
    }

    .race-drawer.open {
      transform: translateX(0);
    }

    .race-drawer-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .race-drawer-tag {
      font-size: 0.70rem;
      font-weight: 800;
      color: var(--apple-orange);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      background: rgba(255, 159, 10, 0.12);
      border: 1px solid rgba(255, 159, 10, 0.30);
      padding: 3px 10px;
      border-radius: 9999px;
    }

    .race-drawer-close {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.10);
      color: var(--text-secondary);
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.95rem;
      line-height: 1;
      transition: all 0.15s ease;
    }

    .race-drawer-close:hover {
      background: rgba(255, 255, 255, 0.20);
      color: var(--text-white);
      transform: scale(1.08);
    }

    .race-drawer-hero {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .race-drawer-title {
      font-family: var(--font-display);
      font-size: 1.65rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--text-white);
      line-height: 1.15;
    }

    .race-drawer-subtitle {
      font-size: 0.88rem;
      color: var(--text-secondary);
      font-weight: 600;
    }

    .race-drawer-target-pill {
      margin-top: 0.4rem;
      align-self: flex-start;
      font-size: 0.80rem;
      font-weight: 800;
      color: var(--apple-orange);
      background: rgba(255, 159, 10, 0.14);
      border: 1px solid rgba(255, 159, 10, 0.35);
      padding: 0.35rem 0.85rem;
      border-radius: 8px;
    }

    .race-section {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 14px;
      padding: 1rem 1.15rem;
    }

    .race-section-title {
      font-size: 0.72rem;
      font-weight: 800;
      color: var(--apple-cyan);
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .race-info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.6rem;
    }

    .race-info-item {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .race-info-label {
      font-size: 0.70rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .race-info-val {
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--text-white);
    }

    .pacing-step {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.45rem 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      font-size: 0.82rem;
    }

    .pacing-step:last-child {
      border-bottom: none;
    }

    .pacing-km {
      font-weight: 800;
      color: var(--text-secondary);
    }

    .pacing-speed {
      font-weight: 800;
      color: var(--apple-orange);
    }

    .pacing-hr {
      font-size: 0.75rem;
      color: var(--text-muted);

<body>

  <div class="planner-container">

    <!-- HEADER -->
    <header>
      <div class="season-pager-bar">
        <button class="season-pager-btn" onclick="prevQuarter()" aria-label="Vorheriges Quartal" title="Vorheriges Quartal">‹</button>
        <div class="season-pager-label">
          <span class="season-pager-title" id="seasonPagerTitle">Winter</span>

    <div class="three-months-grid" id="threeMonthsContainer">

    <!-- META-BANNER UNTER DEN KALENDERN -->
    <div class="quarter-meta-strip" id="quarterMetaStrip">
      <div class="quarter-key-event" id="quarterKeyEvent">Ziel: 07. März · Belgenbachtrail (30,7 km · 941 Hm)</div>
    </div>

  </div>

  <!-- ==========================================================================
       OPTION A: APPLE HIG SLIDE-OVER DRAWER (RACE BRIEFING)
       ========================================================================== -->
  <div class="race-drawer-backdrop" id="raceDrawerBackdrop" onclick="closeRaceDrawer()"></div>
  
  <aside class="race-drawer" id="raceDrawer" aria-label="Wettkampf-Briefing">
    <div class="race-drawer-header">
      <div class="race-drawer-tag" id="drawerTag">WETTKAMPF-BRIEFING</div>
      <button class="race-drawer-close" onclick="closeRaceDrawer()" aria-label="Schließen">✕</button>
    </div>

    <div class="race-drawer-hero">
      <h2 class="race-drawer-title" id="drawerTitle">—</h2>
      <div class="race-drawer-subtitle" id="drawerSubtitle">—</div>
      <div class="race-drawer-target-pill" id="drawerTargetPill">—</div>
    </div>

    <div class="race-drawer-content" id="drawerContent">
      <!-- WIRD DYNAMISCH BEFÜLLT -->
    </div>
  </aside>

  <script>
    const quartersData = {
      0: {
        heading: 'Winter',
        range: 'Jan – März 2027',
        keyEvent: 'Ziel: 07. März · Belgenbachtrail (30,7 km · 941 Hm)',
        months: [
          { name: 'Januar', mIdx: 0, days: 31, startOffset: 4 },
          { name: 'Februar', mIdx: 1, days: 28, startOffset: 0 },
          { name: 'März', mIdx: 2, days: 31, startOffset: 0 }
        ]
      },
      1: {
        heading: 'Frühling',
        range: 'Apr – Juni 2027',
        keyEvent: 'Ziel: 12. Juni · Tschirgant Sky Run TS16 (16,9 km · ~850 Hm)',
        months: [
          { name: 'April', mIdx: 3, days: 30, startOffset: 3 },
          { name: 'Mai', mIdx: 4, days: 31, startOffset: 5 },
          { name: 'Juni', mIdx: 5, days: 30, startOffset: 1 }
        ]
      },
      2: {
        heading: 'Sommer',
        range: 'Juli – Sept 2027',
        keyEvent: 'Ziel: Drachenlauf-Basis & Option: 11. Sept · Ultra Trail Müllerthal (21 km · ~600 Hm)',
        months: [
          { name: 'Juli', mIdx: 6, days: 31, startOffset: 3 },
          { name: 'August', mIdx: 7, days: 31, startOffset: 6 },
          { name: 'September', mIdx: 8, days: 30, startOffset: 2 }
        ]
      },
      3: {
        heading: 'Herbst',
        range: 'Okt – Dez 2027',
        keyEvent: 'Ziel: 24. Oktober · Drachenlauf (26,0 km · 1.250 Hm)',
        months: [
          { name: 'Oktober', mIdx: 9, days: 31, startOffset: 4 },
          { name: 'November', mIdx: 10, days: 30, startOffset: 0 },
          { name: 'Dezember', mIdx: 11, days: 31, startOffset: 2 }
        ]
      }
    };

    function getPhase(mIdx, d) {
      if (mIdx === 1026) { // Nov 2026
        if (d === 8) return 'race'; // Martinslauf 10k
        if (d === 7) return 'option'; // Martinslauf Unterbacher See (Option 5,8k Seerunde)
        if (d < 8) return 'build'; // Rennwoche
        if (d > 8 && d <= 15) return 'rekom'; // Post-Race Woche
        return 'build'; // HM-Vorbereitung ab 16. Nov
      }
      if (mIdx === 1126) { // Dez 2026
        if (d < 6) return 'build';
        if (d === 6) return 'race'; // Siebengebirgs-HM 21,4k
        if (d > 6 && d <= 20) return 'rekom'; // 2 Wochen Erholung
        return '';
      }
      if (mIdx === 0) { // Jan
        if (d >= 6 && d <= 17) return 'build-light'; // KW 1–2: Re-Aktivierung & sanfte Basis
        if (d >= 18) return 'build'; // KW 3–4: Spezifischer Aufbau
        return '';
      }
      if (mIdx === 1) { // Feb
        if (d <= 14) return 'build'; // KW 5–6: Spezifischer Aufbau
        if (d >= 15 && d <= 21) return 'build-peak'; // KW 7: Peak-Woche Schlüsseltraining
        return 'taper'; // KW 8: Tapering & Frische (d >= 22)
      }
      if (mIdx === 2) { // Mär
        if (d < 7) return 'taper'; // KW 9: Tapering bis Rennvortag
        if (d === 7) return 'race'; // Belgenbach 30k Hauptziel Q1
        if (d >= 8 && d <= 14) return 'rekom-acute'; // Post-Race W1: Akute Regeneration & ZNS-Ruhe
        if (d >= 15 && d <= 21) return 'rekom-light'; // Post-Race W2: Aktiver Übergang & Lockertrabs
        return '';
      }
      // --- Q2 (Apr – Jun 2027) ---
      if (mIdx === 3) { // Apr
        if (d >= 19) return 'build-light'; // KW 16–17: Frühjahrs-Reaktivierung & sanfte Basis
        return ''; // 01.–18. Apr: Frühjahrs-Basis & Erhaltung
      }
      if (mIdx === 4) { // Mai
        if (d <= 2) return 'build-light'; // KW 17: Abschluss Re-Aktivierung
        if (d >= 3 && d <= 23) return 'build'; // KW 18–20: Spezifischer Bergaufbau TS16 (400–600 Hm)
        if (d >= 24 && d <= 30) return 'build-peak'; // KW 21: Peak-Woche TS16
        return 'taper'; // 31. Mai: Beginn Tapering
      }
      if (mIdx === 5) { // Jun
        if (d < 12) return 'taper'; // KW 22–23: Tapering vor TS16 (inkl. Standlager Imst)
        if (d === 12) return 'race'; // Tschirgant Sky Run TS16 (16,9 km · ~850 Hm)
        if (d >= 13 && d <= 20) return 'rekom-acute'; // Post-Race W1: Akute alpine Erholung Camping FiNK
        if (d >= 21 && d <= 27) return 'rekom-light'; // Post-Race W2: Aktive Erholung Kaub am Rhein
        return '';
      }

      // --- Q3 (Jul – Sep 2027) ---
      if (mIdx === 6) { // Jul
        return ''; // Sommerpause & freie Grundlagenerhaltung
      }
      if (mIdx === 7) { // Aug
        if (d >= 9) return 'build-light'; // KW 32–34: Sommer-Basis & Einstieg Drachenlauf
        return ''; // 01.–08. Aug: Erhaltung
      }
      if (mIdx === 8) { // Sep
        if (d === 11) return 'option'; // Option: Ultra Trail Müllerthal 21 km (~600 Hm)
        return 'build'; // KW 35–39: Spezifischer Drachenlauf-Aufbau
      }

      // --- Q4 (Okt – Dez 2027) ---
      if (mIdx === 9) { // Okt
        if (d <= 3) return 'build'; // Abschluss spezifischer Aufbau
        if (d >= 4 && d <= 10) return 'build-peak'; // KW 40: Drachenlauf Peak-Woche (22–24 km · 900–1.100 Hm)
        if (d >= 11 && d <= 23) return 'taper'; // KW 41–42: 2 Wochen Tapering & Frische sichern
        if (d === 24) return 'race'; // Saison-Hauptziel: Drachenlauf (26,0 km · 1.250 Hm · 7 Gipfel)
        return 'rekom-acute'; // 25.–31. Okt: Akute Post-Race Quadrizeps-Reparatur
      }
      if (mIdx === 10) { // Nov 2027
        if (d === 7) return 'option'; // Option: Martinslauf U-See 5,8k
        if (d <= 6) return 'rekom-light'; // Post-Race W2: Aktiver Übergang & Lockertrabs
        return ''; // Saisonpause
      }
      if (mIdx === 11) { // Dez
        return ''; // Jahresausklang & Winterruhe
      }
      return '';
    }

    let currentQuarterNum = 0; // Standard: Winter 2027
    const TOTAL_QUARTERS = 4;

    function switchQuarter(qNum) {
      if (qNum < 0) qNum = TOTAL_QUARTERS - 1;
      if (qNum >= TOTAL_QUARTERS) qNum = 0;
      currentQuarterNum = qNum;

      const q = quartersData[qNum];
      if (!q) return;

      const titleEl = document.getElementById('seasonPagerTitle');
      const rangeEl = document.getElementById('seasonPagerRange');
      if (titleEl) titleEl.innerText = q.heading;
      if (rangeEl) rangeEl.innerText = q.range || '';

      const keyEl = document.getElementById('quarterKeyEvent');
      if (keyEl) keyEl.innerText = q.keyEvent;

      renderMonths(q.months);
    }

    function prevQuarter() {
      switchQuarter(currentQuarterNum - 1);
    }

    function nextQuarter() {
      switchQuarter(currentQuarterNum + 1);
    }

    // Tastatur-Navigation (Links / Rechts im Saison-Kalender)
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft') prevQuarter();
      else if (e.key === 'ArrowRight') nextQuarter();
    });

    function renderMonths(months) {
      const container = document.getElementById('threeMonthsContainer');
      let html = '';

      months.forEach(m => {
        html += `
          <div class="month-block">
            <div class="month-header">
              <span class="month-title">${m.name}</span>
            </div>

            <div class="calendar-matrix">
        `;

        let currentDay = 1;
        let weekRow = 0;

        while (currentDay <= m.days) {
          html += `<div class="week-row">`;

          for (let col = 0; col < 7; col++) {
            if (weekRow === 0 && col < m.startOffset) {
              html += `<div class="cal-cell empty"></div>`;
            } else if (currentDay <= m.days) {
              const d = currentDay;
              const isSun = (col === 6);
              const phase = getPhase(m.mIdx, d);
              const prevPhase = (d > 1) ? getPhase(m.mIdx, d - 1) : '';
              const nextPhase = (d < m.days) ? getPhase(m.mIdx, d + 1) : '';

              let barClass = isSun ? 'is-sunday ' : '';
              let isInteractive = false;

              if (phase.startsWith('build') || phase === 'taper' || phase.startsWith('rekom') || phase === 'vacation') {
                barClass += 'phase-' + phase;
                isInteractive = true;
                if (col === 0 || prevPhase !== phase) barClass += ' bar-start';
                if (col === 6 || nextPhase !== phase || d === m.days) barClass += ' bar-end';
              } else if (phase === 'race') {
                barClass += 'phase-race';
                isInteractive = true;
              } else if (phase === 'option') {
                barClass += 'phase-option';
                isInteractive = true;
              } else {
                barClass += 'neutral-day';
              }

              if (isInteractive) {
                barClass += ' is-interactive';
                html += `<div class="cal-cell ${barClass}" onclick="onPhaseClick(${m.mIdx}, ${d}, '${phase}', event)">${d}</div>`;
              } else {
                html += `<div class="cal-cell ${barClass}">${d}</div>`;
              }
              currentDay++;
            } else {
              html += `<div class="cal-cell empty"></div>`;
            }
          }

          html += `</div>`;
          weekRow++;
        }

        html += `
            </div>
          </div>
        `;
      });

      container.innerHTML = html;
    }

    // Interaktive Erklärungen bei Klick auf Phasen-Balken & Renntage (Keine Sublines, keine Tagesdetails)
    function onPhaseClick(mIdx, day, phase, event) {
      document.querySelectorAll('.cal-cell').forEach(c => c.classList.remove('is-selected'));
      if (event && event.currentTarget) {
        event.currentTarget.classList.add('is-selected');
      }

      const keyEl = document.getElementById('quarterKeyEvent');

      // 1. GESETZTE WETTKÄMPFE (ORANGE)
      if (mIdx === 1026 && day === 8) {
        keyEl.innerHTML = '08. November 2026 · 48. SFD Martinslauf 10k (Unterbacher See Düsseldorf · Sub 58 min) · <a href="https://www.sfd.de/martinslauf/" target="_blank" rel="noopener noreferrer" class="option-reg-link">Infos ↗</a>';
        openRaceDrawer('martinslauf');
        return;
      }
      if (mIdx === 1126 && day === 6) {
        keyEl.innerHTML = '06. Dezember 2026 · Siebengebirgs-HM (21,4 km · 360 Hm)';
        openRaceDrawer('7ghm');
        return;
      }
      if (mIdx === 2 && day === 7) {
        keyEl.innerHTML = '07. März 2027 · Belgenbachtrail (30,7 km · 941 Hm) · <a href="https://my.raceresult.com/417090/registration" target="_blank" rel="noopener noreferrer" class="option-reg-link">Zur Anmeldung ↗</a>';
        openRaceDrawer('belgenbach');
        return;
      }
      if (mIdx === 5 && day === 12) {
        keyEl.innerHTML = '12. Juni 2027 · Tschirgant Sky Run TS16 (16,9 km · ~850 Hm)';
        openRaceDrawer('ts16');
        return;
      }
      if (mIdx === 9 && day === 24) {
        keyEl.innerHTML = '24. Oktober 2027 · Drachenlauf (26,0 km · 1.250 Hm)';
        openRaceDrawer('drachenlauf');
        return;
      }

      // 2. OPTIONALE LÄUFE (LILA GESTRICHELT MIT KLICKBAREN ANMELDELINKS)
      if (mIdx === 8 && day === 5) {
        keyEl.innerHTML = 'Option: 05. September 2027 · Trail Côte d’Opale (24 km · 350 Hm) · <a href="https://www.trailcotedopale.com/" target="_blank" rel="noopener noreferrer" class="option-reg-link">Zur Anmeldung / Infos ↗</a>';
        return;
      }
      if (mIdx === 8 && day === 11) {
        keyEl.innerHTML = 'Option: 11. September 2027 · Ultra Trail Müllerthal (21 km · ~600 Hm) · <a href="https://www.utml.lu/" target="_blank" rel="noopener noreferrer" class="option-reg-link">Zur Anmeldung / Infos ↗</a>';
        return;
      }
      if (mIdx === 10 && day === 7) {
        keyEl.innerHTML = 'Option: 07. November 2027 · Martinslauf U-See (5,8 km Seerunde / Unterbacher See) · <a href="https://www.sfd.de/martinslauf/" target="_blank" rel="noopener noreferrer" class="option-reg-link">Zur Anmeldung / Infos ↗</a>';
        return;
      }
      if (phase === 'option') {
        keyEl.innerHTML = 'Vielleicht gibt es noch Laufoptionen hier';
        return;
      }

      // 3. PHASE-BLÖCKE (GESTUFTE CYCLING-STUFEN ÜBER DAS GESAMTE JAHR 2027)
      if (phase === 'build-light') {
        if (mIdx === 0) {
          keyEl.innerHTML = 'Phase 1 (06.–17. Jan) · Re-Aktivierung & sanfte Basis (GA1 VT1 105–118 bpm) · Wiedereinstieg nach Jahreswechsel';
          return;
        }
        if (mIdx === 3 || mIdx === 4) {
          keyEl.innerHTML = 'Frühjahrs-Reaktivierung (19. Apr – 02. Mai) · Sanfte Basis & GA1-Umfang vor dem TS16-Bergblock';
          return;
        }
        if (mIdx === 7) {
          keyEl.innerHTML = 'Sommer-Basis (09.–29. Aug) · Sanfter Wiedereinstieg & GA1-Kilometer vor dem Drachenlauf-Zyklus';
          return;
        }
        keyEl.innerHTML = 'Grundlagen- & Re-Aktivierungsphase (GA1 VT1 105–118 bpm)';
        return;
      }
      if (phase === 'build') {
        if (mIdx === 0 || mIdx === 1) {
          keyEl.innerHTML = 'Phase 2 (18. Jan – 14. Feb) · Spezifischer Aufbau Belgenbachtrail · Erkrath-Longruns (350–450 Hm) & Tempohärte';
          return;
        }
        if (mIdx === 4) {
          keyEl.innerHTML = 'Spezifischer Bergaufbau TS16 (03.–23. Mai) · Höhenmeter-Gewöhnung (400–600 Hm), Hang-Kraftausdauer & Trittsicherheit';
          return;
        }
        if (mIdx === 8 || (mIdx === 9 && day <= 3)) {
          keyEl.innerHTML = 'Spezifischer Drachenlauf-Aufbau (Sep – Anfang Okt) · Treppen, 7-Gipfel-Simulation & Steilhänge (inkl. 11.09. UTML)';
          return;
        }
        if (mIdx === 1026) {
          keyEl.innerHTML = (day < 8) 
            ? 'Zuspitzung & Tapering · Martinslauf 10k' 
            : 'Spezifischer Aufbau · Siebengebirgs-HM (21,4 km · 360 Hm)';
          return;
        }
        if (mIdx === 1126) {
          keyEl.innerHTML = 'Tapering & Feinschliff · Siebengebirgs-HM (06. Dez)';
          return;
        }
        keyEl.innerHTML = 'Spezifischer Trainings- & Aufbau-Block';
        return;
      }
      if (phase === 'build-peak') {
        if (mIdx === 1) {
          keyEl.innerHTML = 'Phase 3 (15.–21. Feb) · Peak-Woche Belgenbach · Schlüsseltraining (20–22 km Trail) & maximale Spezifik';
          return;
        }
        if (mIdx === 4) {
          keyEl.innerHTML = 'Peak-Woche TS16 (24.–30. Mai) · Spezifischer Bergab-Bremskraft-Reiz & alpine Höhenmeter';
          return;
        }
        if (mIdx === 9) {
          keyEl.innerHTML = 'Drachenlauf Peak-Woche (04.–10. Okt) · Schlüssel-Longrun Siebengebirge (22–24 km · 900–1.100 Hm)';
          return;
        }
        keyEl.innerHTML = 'Peak-Woche · Schlüsseltraining & maximale wettkampfspezifische Belastung';
        return;
      }
      if (phase === 'taper') {
        if (mIdx === 1 || (mIdx === 2 && day < 7)) {
          keyEl.innerHTML = 'Phase 4 (22. Feb – 06. März) · Tapering Belgenbach · Umfang -40%, Spezifik punktuell halten';
          return;
        }
        if (mIdx === 4 || (mIdx === 5 && day < 12)) {
          keyEl.innerHTML = 'Tapering TS16 (31. Mai – 11. Juni) · Frische sichern & Akklimatisation im Standlager Camping FiNK Imst';
          return;
        }
        if (mIdx === 9 && day >= 11 && day <= 23) {
          keyEl.innerHTML = 'Finales Tapering Drachenlauf (11.–23. Okt) · Umfang -40%, Beine lockern, ZNS entlasten, Glykogen sichern';
          return;
        }
        keyEl.innerHTML = 'Tapering-Phase · Umfang deutlich reduzieren, Frische & Spannung sichern';
        return;
      }
      if (phase === 'rekom-acute') {
        if (mIdx === 2) {
          keyEl.innerHTML = 'Post-Race Woche 1 (08.–14. März) · Akute Regeneration Belgenbach · ZNS-Erholung & Muskelreparatur';
          return;
        }
        if (mIdx === 5) {
          keyEl.innerHTML = 'Post-Race Woche 1 (13.–20. Juni) · Akute alpine Regeneration Camping FiNK · Null Laufbelastung, reines Familienwandern';
          return;
        }
        if (mIdx === 9) {
          keyEl.innerHTML = 'Post-Race Woche 1 (25.–31. Okt) · Akute Drachenlauf-Regeneration · Exzentrische Quadrizeps-Reparatur & ZNS-Ruhe';
          return;
        }
        keyEl.innerHTML = 'Akute Post-Race Regeneration · Muskuläre Reparatur & ZNS-Ruhe';
        return;
      }
      if (phase === 'rekom-light') {
        if (mIdx === 2) {
          keyEl.innerHTML = 'Post-Race Woche 2 (15.–21. März) · Aktive Erholung Belgenbach · Erste kurze GA1-Lockertrabs (VT1 105–118 bpm)';
          return;
        }
        if (mIdx === 5) {
          keyEl.innerHTML = 'Post-Race Woche 2 (21.–27. Juni) · Aktive Erholung Kaub am Rhein · Kurze GA1-Lockertrabs im Flachen';
          return;
        }
        if (mIdx === 10) {
          keyEl.innerHTML = 'Post-Race Woche 2 (01.–06. Nov) · Aktiver Übergang nach Drachenlauf · Kurze GA1-Trabs vor Saisonpause';
          return;
        }
        keyEl.innerHTML = 'Aktive Erholung & Übergang · Sanfte GA1-Lockertrabs (VT1)';
        return;
      }
      if (phase === 'rekom') {
        if (mIdx === 1026) {
          keyEl.innerHTML = 'Post-Race Erholung · Nach Martinslauf 10k';
          return;
        }
        if (mIdx === 1126) {
          keyEl.innerHTML = 'Saisonpause & Jahresausklang · Nach Siebengebirgs-HM';
          return;
        }
        if (mIdx === 5) {
          keyEl.innerHTML = 'Erholung & Regeneration · Nach Tschirgant Sky Run TS16';
          return;
        }
        if (mIdx === 9) {
          keyEl.innerHTML = 'Große Saison-Regeneration · Nach Drachenlauf';
          return;
        }
        keyEl.innerHTML = 'Regenerationsphase (Tapering / Erholung)';
        return;
      }
    }

    // ==========================================================================
    // OPTION A: RACE BRIEFING SPECIFICATIONS (APPLE HIG SLIDE-OVER DRAWER)
    // ==========================================================================
    const raceBriefings = {
      martinslauf: {
        tag: 'WETTKAMPF-BRIEFING · 10 KM',

        sections: [
          {

            items: [

            ]
          },
          {

            steps: [
              { km: 'KM 0 – 3', speed: '5:50 min/km', hr: '< 118 bpm (Strikt kontrolliert am See)' },
              { km: 'KM 3 – 7', speed: '5:45 min/km', hr: '120–125 bpm (Rhythmus halten)' },

    function openRaceDrawer(raceKey) {
      const b = raceBriefings[raceKey];
      if (!b) return;

      document.getElementById('drawerTag').innerText = b.tag || 'WETTKAMPF-BRIEFING';
      document.getElementById('drawerTitle').innerText = b.title || '';
      document.getElementById('drawerSubtitle').innerText = b.subtitle || '';
      document.getElementById('drawerTargetPill').innerText = b.targetPill || '';

      let contentHtml = '';
      if (b.sections) {
        b.sections.forEach(sec => {
          contentHtml += `<div class="race-section">`;
          contentHtml += `<div class="race-section-title">${sec.title}</div>`;

          if (sec.type === 'grid' && sec.items) {
            contentHtml += `<div class="race-info-grid">`;
            sec.items.forEach(it => {
              contentHtml += `
                <div class="race-info-item">
                  <span class="race-info-label">${it.label}</span>
                  <span class="race-info-val">${it.val}</span>
                </div>
              `;
            });
            contentHtml += `</div>`;
          } else if (sec.type === 'pacing' && sec.steps) {
            contentHtml += `<div class="pacing-list">`;
            sec.steps.forEach(st => {
              contentHtml += `
                <div class="pacing-step">
                  <span class="pacing-km">${st.km}</span>
                  <span class="pacing-speed">${st.speed}</span>
                  <span class="pacing-hr">${st.hr}</span>
                </div>
              `;
            });
            contentHtml += `</div>`;
          } else if (sec.type === 'text') {
            contentHtml += `<div class="race-note-text">${sec.text}</div>`;
          }

          contentHtml += `</div>`;
        });
      }

      document.getElementById('drawerContent').innerHTML = contentHtml;

      document.getElementById('raceDrawer').classList.add('open');
      document.getElementById('raceDrawerBackdrop').classList.add('open');
    }

    function closeRaceDrawer() {
      const drawer = document.getElementById('raceDrawer');
      const backdrop = document.getElementById('raceDrawerBackdrop');
      if (drawer) drawer.classList.remove('open');
      if (backdrop) backdrop.classList.remove('open');
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        closeRaceDrawer();
      }
    });

    switchQuarter(0);
